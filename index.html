<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>HairOs · Cortes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #f7f5f2;
      --bg-secondary: #ece8e2;
      --text-primary: #1a1816;
      --text-secondary: #5a5550;
      --text-muted: #8a8580;
      --border-light: rgba(26, 24, 22, 0.06);
      --shadow-soft: 0 8px 32px rgba(26, 24, 22, 0.06);
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* ----- HEADER - ÉDITORIAL ----- */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      background: rgba(247, 245, 242, 0.72);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border-light);
      padding: 18px 24px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      color: var(--text-primary);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .logo span {
      font-weight: 300;
      letter-spacing: 0.3em;
      color: var(--text-secondary);
      font-size: 0.7rem;
      margin-left: 2px;
    }

    .logo-divider {
      width: 1px;
      height: 28px;
      background: var(--border-light);
      margin: 0 4px;
    }

    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: rgba(26, 24, 22, 0.04);
      border-radius: 0;
      padding: 0 0 0 18px;
      border-bottom: 1px solid var(--border-light);
      transition: 0.25s ease;
      max-width: 380px;
    }

    .search-box:focus-within {
      border-bottom-color: var(--text-primary);
    }

    .search-box i {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-right: 12px;
      opacity: 0.6;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      padding: 10px 0;
      width: 100%;
      letter-spacing: 0.02em;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
      font-weight: 300;
      letter-spacing: 0.04em;
      font-size: 0.8rem;
    }

    .filter-group {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 20px;
      font-size: 0.7rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      transition: 0.2s ease;
      cursor: pointer;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      position: relative;
    }

    .filter-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 1.5px;
      background: var(--text-primary);
      transition: 0.25s ease;
    }

    .filter-btn.active {
      color: var(--text-primary);
    }

    .filter-btn.active::after {
      width: 60%;
    }

    .filter-btn:hover:not(.active) {
      color: var(--text-secondary);
    }

    /* ----- CARROSSEL - CARD EDITORIAL ----- */
    .carousel-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      width: 100%;
      margin-top: 105px;
      margin-bottom: 80px;
      padding: 0 12px;
    }

    .carousel-track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      overflow-y: visible;
      padding: 8px 4px 20px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      width: 100%;
      justify-content: flex-start;
      align-items: center;
      height: 100%;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    /* ----- CARD - ESTILO VOGUE PARIS 60s ----- */
    .card {
      flex: 0 0 auto;
      width: calc(100vw - 40px);
      max-width: 340px;
      height: calc(100vh - 210px);
      max-height: 580px;
      border-radius: 0;
      background: var(--bg-secondary);
      position: relative;
      overflow: hidden;
      scroll-snap-align: center;
      box-shadow: var(--shadow-soft);
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.4s ease;
      cursor: pointer;
      border: none;
      background-size: cover;
      background-position: center;
      min-width: 80vw;
    }

    @media (min-width: 420px) {
      .card {
        min-width: 300px;
        width: 300px;
      }
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 48px rgba(26, 24, 22, 0.12);
    }

    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 55%;
      background: linear-gradient(to top, rgba(26, 24, 22, 0.85) 0%, rgba(26, 24, 22, 0.2) 50%, transparent 100%);
      pointer-events: none;
      border-radius: 0;
    }

    .card-content {
      position: absolute;
      bottom: 28px;
      left: 28px;
      right: 28px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      z-index: 2;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 2rem;
      line-height: 1.1;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.3);
      margin-bottom: 2px;
    }

    .card-title i {
      font-style: italic;
      font-weight: 300;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 4px 16px 4px 14px;
      border-radius: 0;
      font-size: 0.65rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.8);
      display: inline-flex;
      align-items: center;
    }

    .pulse-text {
      margin-top: 10px;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadePulse 2.8s ease-in-out infinite;
    }

    .pulse-text i {
      font-size: 0.7rem;
      opacity: 0.5;
    }

    @keyframes fadePulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    /* ----- FOOTER - MINIMALISTA ----- */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      background: rgba(247, 245, 242, 0.72);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 1px solid var(--border-light);
      padding: 10px 0 14px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .footer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--text-muted);
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: 0.2s ease;
      cursor: default;
    }

    .footer-item i {
      font-size: 1.2rem;
      margin-bottom: 2px;
      opacity: 0.6;
      transition: 0.2s ease;
    }

    .footer-item.active {
      color: var(--text-primary);
    }

    .footer-item.active i {
      opacity: 1;
    }

    .footer-item:hover:not(.active) i {
      opacity: 0.9;
    }

    /* ----- MODAL - EDITORIAL FULLSCREEN ----- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 24, 22, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 999;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.4s ease;
    }

    .modal-overlay.open {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-card {
      background: var(--bg-primary);
      border-radius: 0;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      padding: 28px 24px 28px;
      border: none;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 480px) {
      .modal-card {
        max-width: 100%;
        max-height: 94vh;
        padding: 20px 16px 22px;
      }
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      transition: 0.25s ease;
      line-height: 1;
      padding: 4px 8px;
      z-index: 5;
      font-weight: 300;
    }

    .modal-close:hover {
      color: var(--text-primary);
      transform: rotate(90deg);
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 2rem;
      color: var(--text-primary);
      margin: 2px 0 0;
      letter-spacing: 0.02em;
      padding-right: 48px;
    }

    .modal-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .modal-carousel {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      background: var(--bg-secondary);
      border-radius: 0;
      overflow: hidden;
      margin: 2px 0 14px;
      border: none;
      flex-shrink: 0;
    }

    .modal-carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.25s ease;
    }

    .modal-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(247, 245, 242, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: #ffffff;
      font-size: 1.2rem;
      padding: 8px 14px;
      border-radius: 0;
      cursor: pointer;
      z-index: 10;
      transition: 0.2s ease;
      font-weight: 300;
    }

    .modal-arrow:hover {
      background: rgba(247, 245, 242, 0.2);
    }

    .modal-arrow.left { left: 8px; }
    .modal-arrow.right { right: 8px; }

    @media (max-width: 479px) {
      .modal-arrow {
        font-size: 1rem;
        padding: 6px 10px;
      }
    }

    .modal-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      padding-bottom: 2px;
      flex-shrink: 0;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--border-light);
      border-radius: 0;
      transition: 0.25s ease;
      cursor: pointer;
      border: none;
      padding: 0;
    }

    .dot.active {
      background: var(--text-primary);
      width: 24px;
    }

    /* ----- RESPONSIVO ----- */
    @media (max-width: 400px) {
      .header {
        padding: 12px 16px 10px;
        gap: 10px;
      }

      .logo {
        font-size: 1.1rem;
        letter-spacing: 0.1em;
      }
      .logo span { font-size: 0.6rem; }

      .search-box {
        max-width: 200px;
        padding-left: 12px;
      }
      .search-box input {
        font-size: 0.75rem;
        padding: 8px 0;
      }
      .search-box i { font-size: 0.75rem; }

      .filter-btn {
        font-size: 0.6rem;
        padding: 4px 14px;
      }

      .carousel-wrapper {
        margin-top: 98px;
        margin-bottom: 72px;
        padding: 0 6px;
      }

      .card {
        min-width: 78vw;
        width: calc(100vw - 24px);
        height: calc(100vh - 190px);
        max-height: 460px;
      }

      .card-title { font-size: 1.6rem; }
      .card-content { bottom: 20px; left: 20px; right: 20px; }
      .tag { font-size: 0.55rem; padding: 3px 12px; }
      .pulse-text { font-size: 0.6rem; }

      .footer {
        padding: 8px 0 12px;
      }
      .footer-item i {
        font-size: 1rem;
      }
      .footer-item {
        font-size: 0.5rem;
      }

      .modal-card {
        padding: 16px 14px 18px;
        max-height: 95vh;
      }
      .modal-title { font-size: 1.5rem; }
      .modal-sub { font-size: 0.6rem; }
      .modal-close {
        font-size: 1.2rem;
        top: 12px;
        right: 14px;
      }
    }

    @media (min-width: 401px) and (max-width: 600px) {
      .card {
        min-width: 250px;
        width: calc(100vw - 36px);
        height: calc(100vh - 200px);
        max-height: 500px;
      }
      .card-title { font-size: 1.7rem; }
    }

    .no-results {
      color: var(--text-muted);
      font-weight: 300;
      padding: 24px;
      text-align: center;
      width: 100%;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
    }

    .no-results i {
      opacity: 0.2;
      display: block;
      font-size: 2rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="header" role="banner">
    <div class="header-top">
      <div class="logo">
        HairOs <span>cortes</span>
        <span class="logo-divider"></span>
      </div>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Buscar corte..." aria-label="Buscar cortes">
      </div>
    </div>
    <div class="filter-group" id="filterGroup">
      <button class="filter-btn active" data-filter="todos">Todos</button>
      <button class="filter-btn" data-filter="curto">Curto</button>
      <button class="filter-btn" data-filter="medio">Médio</button>
      <button class="filter-btn" data-filter="longo">Longo</button>
    </div>
  </header>

  <!-- CARROSSEL -->
  <main class="carousel-wrapper">

  <!-- FOOTER -->

    <div class="footer-item"><i class="fas fa-heart"></i><span>Favoritos</span></div>
    <div class="footer-item"><i class="fas fa-user"></i><span>Perfil</span></div>
  </footer>

  <!-- MODAL -->

    <div class="modal-card" id="modalCard">

      </div>
      <div class="modal-dots" id="modalDots"></div>
    </div>
  </div>

          "https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 10, nome: "Octopus", tamanho: "longo", imagens: [
          "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1531751782190-fc6f0f0c5e6e?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1560869713-2b7f2b6a57d?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 11, nome: "Curtain Bangs", tamanho: "medio", imagens: [
          "https://images.unsplash.com/photo-1562322140-8baeececf3df?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 12, nome: "Shag", tamanho: "longo", imagens: [
          "https://images.unsplash.com/photo-1531751782190-fc6f0f0c5e6e?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 13, nome: "French Bob", tamanho: "curto", imagens: [
          "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1560869713-2b7f2b6a57d?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format"
        ] }
      ];

      const track = document.getElementById('carouselTrack');
      const searchInput = document.getElementById('searchInput');
      const filterGroup = document.getElementById('filterGroup');
      const modalOverlay = document.getElementById('modalOverlay');
      const modalClose = document.getElementById('modalClose');
      const modalTitle = document.getElementById('modalTitle');
      const modalSub = document.getElementById('modalSub');
      const modalImg = document.getElementById('modalImg');
      const modalPrev = document.getElementById('modalPrev');
      const modalNext = document.getElementById('modalNext');
      const modalDots = document.getElementById('modalDots');

      let currentModalData = null;
      let currentImageIndex = 0;
      let currentFilter = 'todos';
      let searchTerm = '';

      function renderCards() {
        const filtered = cortes.filter(c => {
          const matchSize = currentFilter === 'todos' || c.tamanho === currentFilter;
          const matchSearch = c.nome.toLowerCase().includes(searchTerm.toLowerCase());
          return matchSize && matchSearch;
        });

        if (filtered.length === 0) {
          track.innerHTML = `<div class="no-results"><i class="fas fa-cut"></i>Nenhum corte encontrado</div>`;
          return;
        }

        let html = '';
        filtered.forEach(c => {
          const firstImg = c.imagens[0] || 'https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format';
          html += `
            <div class="card" data-id="${c.id}" style="background-image: url('${firstImg}');">
              <div class="card-overlay"></div>
              <div class="card-content">
                <div class="card-title">${c.nome}</div>
                <div class="card-tags">
                  <span class="tag">${c.tamanho}</span>
                </div>
                <div class="pulse-text"><i class="fas fa-hand-pointer"></i> Clique para ver mais</div>
              </div>
            </div>
          `;
        });
        track.innerHTML = html;

        document.querySelectorAll('.card').forEach(el => {
          el.addEventListener('click', function(e) {
            const id = parseInt(this.dataset.id);
            const corte = cortes.find(c => c.id === id);
            if (corte) openModal(corte);
          });
        });
      }

      function openModal(corte) {
        currentModalData = corte;
        currentImageIndex = 0;
        modalTitle.textContent = corte.nome;
        modalSub.textContent = `${corte.tamanho} • ${corte.imagens.length} imagens`;
        updateModalImage();
        renderDots();
        modalOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        modalOverlay.classList.remove('open');
        document.body.style.overflow = '';
        currentModalData = null;
      }

      function updateModalImage() {
        if (!currentModalData) return;
        const imgUrl = currentModalData.imagens[currentImageIndex] || currentModalData.imagens[0];
        modalImg.src = imgUrl;
        document.querySelectorAll('.dot').forEach((d, i) => {
          d.classList.toggle('active', i === currentImageIndex);
        });
      }

      function renderDots() {
        if (!currentModalData) return;
        const total = currentModalData.imagens.length;
        let dotsHtml = '';
        for (let i = 0; i < total; i++) {
          dotsHtml += `<button class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></button>`;
        }
        modalDots.innerHTML = dotsHtml;
        document.querySelectorAll('.dot').forEach(dot => {
          dot.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index);
            if (!isNaN(idx) && currentModalData && idx < currentModalData.imagens.length) {
              currentImageIndex = idx;
              updateModalImage();
            }
          });
        });
      }

      function navigateModal(delta) {
        if (!currentModalData) return;
        const total = currentModalData.imagens.length;
        currentImageIndex = (currentImageIndex + delta + total) % total;
        updateModalImage();
      }

      filterGroup.addEventListener('click', function(e) {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderCards();
      });

      searchInput.addEventListener('input', function() {
        searchTerm = this.value.trim();
        renderCards();
      });

      modalClose.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) closeModal();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
        if (e.key === 'ArrowLeft' && modalOverlay.classList.contains('open')) {
          e.preventDefault();
          navigateModal(-1);
        }
        if (e.key === 'ArrowRight' && modalOverlay.classList.contains('open')) {
          e.preventDefault();
          navigateModal(1);
        }
      });
      modalPrev.addEventListener('click', function(e) {
        e.stopPropagation();
        navigateModal(-1);
      });
      modalNext.addEventListener('click', function(e) {
        e.stopPropagation();
        navigateModal(1);
      });

      renderCards();
    })();
  </script>
</body>
</html>

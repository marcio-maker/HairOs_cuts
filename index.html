<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>HairOs · Cortes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #faf8f5;
      --bg-card: #ffffff;
      --text-primary: #1c1a17;
      --text-secondary: #6b6560;
      --text-muted: #a69f98;
      --accent: #c0392b;
      --accent-light: #e74c3c;
      --border: #e8e3dd;
      --shadow: 0 4px 24px rgba(0,0,0,0.04);
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-weight: 400;
    }

    /* ----- HEADER - MINIMALISTA ELEGANTE ----- */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      background: var(--bg-primary);
      border-bottom: 2px solid var(--border);
      padding: 16px 24px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .logo span {
      font-weight: 400;
      color: var(--accent);
      font-style: italic;
      font-size: 2rem;
    }

    .logo-divider {
      width: 24px;
      height: 1px;
      background: var(--border);
      margin: 0 8px;
    }

    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0 16px;
      transition: 0.2s ease;
      max-width: 340px;
    }

    .search-box:focus-within {
      border-color: var(--text-primary);
    }

    .search-box i {
      color: var(--text-muted);
      font-size: 1rem;
      margin-right: 12px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      padding: 12px 0;
      width: 100%;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
      font-weight: 300;
    }

    .filter-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 22px;
      font-size: 0.9rem;
      font-weight: 500;
      font-family: 'Space Grotesk', sans-serif;
      transition: 0.2s ease;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }

    .filter-btn.active {
      color: var(--text-primary);
      border-color: var(--text-primary);
      background: var(--bg-card);
    }

    .filter-btn:hover:not(.active) {
      color: var(--text-secondary);
      border-color: var(--border);
    }

    /* ----- CARROSSEL - CARD EDITORIAL ----- */
    .carousel-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      width: 100%;
      margin-top: 105px;
      margin-bottom: 80px;
      padding: 0 20px;
    }

    .carousel-track {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      overflow-y: visible;
      padding: 8px 4px 20px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      width: 100%;
      justify-content: flex-start;
      align-items: center;
      height: 100%;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    /* ----- CARD - ESTILO REVISTA DE ARTE ----- */
    .card {
      flex: 0 0 auto;
      width: calc(100vw - 48px);
      max-width: 340px;
      height: calc(100vh - 210px);
      max-height: 600px;
      border-radius: 0;
      background: var(--bg-card);
      position: relative;
      overflow: hidden;
      scroll-snap-align: center;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.4s ease;
      cursor: pointer;
      border: 1px solid var(--border);
      background-size: cover;
      background-position: center;
      min-width: 80vw;
    }

    @media (min-width: 420px) {
      .card {
        min-width: 300px;
        width: 300px;
      }
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    }

    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 55%;
      background: linear-gradient(to top, rgba(28, 26, 23, 0.9) 0%, rgba(28, 26, 23, 0.1) 60%, transparent 100%);
      pointer-events: none;
    }

    .card-content {
      position: absolute;
      bottom: 28px;
      left: 28px;
      right: 28px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      z-index: 2;
    }

    .card-title {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 2.2rem;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 2px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 4px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: lowercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.8);
      display: inline-flex;
      align-items: center;
    }

    .tag-fav {
      background: rgba(192, 57, 43, 0.2);
      border-color: rgba(192, 57, 43, 0.3);
      color: #c0392b;
    }

    .pulse-text {
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadePulse 3s ease-in-out infinite;
    }

    .pulse-text i {
      font-size: 0.85rem;
    }

    @keyframes fadePulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    /* ----- FOOTER - COM FUNÇÕES ----- */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      background: var(--bg-primary);
      border-top: 2px solid var(--border);
      padding: 12px 0 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .footer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: lowercase;
      transition: 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 12px;
    }

    .footer-item i {
      font-size: 1.6rem;
      margin-bottom: 2px;
      transition: 0.2s ease;
    }

    .footer-item.active {
      color: var(--text-primary);
    }

    .footer-item.active i {
      color: var(--accent);
    }

    .footer-item:hover:not(.active) i {
      color: var(--text-secondary);
    }

    /* ----- MODAL - REVISTA ----- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(28, 26, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .modal-overlay.open {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: var(--bg-primary);
      width: 100%;
      max-width: 440px;
      max-height: 92vh;
      padding: 28px 24px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 480px) {
      .modal-card {
        max-width: 100%;
        max-height: 96vh;
        padding: 20px 16px 22px;
      }
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.6rem;
      cursor: pointer;
      transition: 0.2s ease;
      line-height: 1;
      padding: 4px 8px;
      z-index: 15;
    }

    .modal-close:hover {
      color: var(--text-primary);
    }

    .modal-title {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 2.2rem;
      color: var(--text-primary);
      margin: 2px 0 0;
      letter-spacing: -0.02em;
    }

    .modal-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: lowercase;
    }

    .modal-carousel {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      background: var(--bg-card);
      overflow: hidden;
      margin: 2px 0 14px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s ease;
    }

    /* BOTÃO DE FAVORITAR NA IMAGEM DO MODAL */
    .modal-img-fav {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(28, 26, 23, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: 0.2s ease;
    }

    .modal-img-fav:hover {
      transform: scale(1.1);
      background: rgba(28, 26, 23, 0.9);
    }

    .modal-img-fav.fav {
      color: var(--accent);
      background: rgba(192, 57, 43, 0.3);
      border-color: rgba(192, 57, 43, 0.4);
    }

    .modal-img-fav.fav:hover {
      background: rgba(192, 57, 43, 0.4);
    }

    .modal-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(28, 26, 23, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.06);
      color: #ffffff;
      font-size: 1.6rem;
      padding: 8px 16px;
      cursor: pointer;
      z-index: 10;
      transition: 0.2s ease;
    }

    .modal-arrow:hover {
      background: rgba(28, 26, 23, 0.8);
    }

    .modal-arrow.left { left: 8px; }
    .modal-arrow.right { right: 8px; }

    @media (max-width: 479px) {
      .modal-arrow {
        font-size: 1.2rem;
        padding: 6px 12px;
      }
      .modal-img-fav {
        width: 40px;
        height: 40px;
        font-size: 1rem;
        bottom: 12px;
        right: 12px;
      }
    }

    .modal-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      padding-bottom: 2px;
      flex-shrink: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--border);
      transition: 0.25s ease;
      cursor: pointer;
      border: none;
      padding: 0;
    }

    .dot.active {
      background: var(--text-primary);
      width: 28px;
    }

    /* ----- MODAL GALERIA (GRID) ----- */
    .gallery-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(28, 26, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .gallery-modal.open {
      display: flex;
    }

    .gallery-content {
      background: var(--bg-primary);
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      padding: 28px 24px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
      position: relative;
      overflow-y: auto;
    }

    .gallery-content::-webkit-scrollbar {
      width: 4px;
    }

    .gallery-content::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }

    .gallery-title {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 1.6rem;
      color: var(--text-primary);
    }

    .gallery-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.6rem;
      cursor: pointer;
      transition: 0.2s ease;
      padding: 4px 8px;
    }

    .gallery-close:hover {
      color: var(--text-primary);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 3/4;
      background: var(--bg-card);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .gallery-item:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      z-index: 2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-item-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 8px 10px;
      background: linear-gradient(to top, rgba(28, 26, 23, 0.8), transparent);
    }

    .gallery-item-name {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 0.85rem;
      color: #ffffff;
    }

    .gallery-item-tag {
      font-size: 0.55rem;
      color: rgba(255,255,255,0.6);
      text-transform: lowercase;
      letter-spacing: 0.06em;
    }

    .gallery-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
      font-size: 0.95rem;
    }

    .gallery-empty i {
      font-size: 3rem;
      opacity: 0.2;
      display: block;
      margin-bottom: 16px;
    }

    /* ----- MODAL DIÁRIO (FAVORITOS DE IMAGENS) ----- */
    .diary-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(28, 26, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .diary-modal.open {
      display: flex;
    }

    .diary-content {
      background: var(--bg-primary);
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      padding: 28px 24px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
      position: relative;
      overflow-y: auto;
    }

    .diary-content::-webkit-scrollbar {
      width: 4px;
    }

    .diary-content::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .diary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }

    .diary-title {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 1.6rem;
      color: var(--text-primary);
    }

    .diary-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.6rem;
      cursor: pointer;
      transition: 0.2s ease;
      padding: 4px 8px;
    }

    .diary-close:hover {
      color: var(--text-primary);
    }

    .diary-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .diary-item:last-child {
      border-bottom: none;
    }

    .diary-item-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      cursor: pointer;
    }

    .diary-item-img:hover {
      opacity: 0.8;
    }

    .diary-item-info {
      flex: 1;
    }

    .diary-item-name {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 1rem;
      color: var(--text-primary);
    }

    .diary-item-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: lowercase;
      letter-spacing: 0.06em;
    }

    .diary-item-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s ease;
      padding: 4px 8px;
    }

    .diary-item-remove:hover {
      color: var(--accent);
    }

    .diary-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
      font-size: 0.95rem;
    }

    .diary-empty i {
      font-size: 3rem;
      opacity: 0.2;
      display: block;
      margin-bottom: 16px;
    }

    /* ----- PERFIL ----- */
    .perfil-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(28, 26, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .perfil-modal.open {
      display: flex;
    }

    .perfil-content {
      background: var(--bg-primary);
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      padding: 28px 24px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
      position: relative;
      overflow-y: auto;
    }

    .perfil-content::-webkit-scrollbar {
      width: 4px;
    }

    .perfil-content::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .perfil-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }

    .perfil-title {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 1.6rem;
      color: var(--text-primary);
    }

    .perfil-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.6rem;
      cursor: pointer;
      transition: 0.2s ease;
      padding: 4px 8px;
    }

    .perfil-close:hover {
      color: var(--text-primary);
    }

    .perfil-avatar {
      text-align: center;
      padding: 10px 0 20px;
      position: relative;
    }

    .perfil-avatar-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--border);
      object-fit: cover;
      margin: 0 auto 12px;
      display: block;
      background: var(--bg-card);
    }

    .perfil-avatar-placeholder {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--border);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      color: var(--text-muted);
      background: var(--bg-card);
    }

    .perfil-avatar-upload {
      position: relative;
      display: inline-block;
      margin-top: -10px;
    }

    .perfil-avatar-upload input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .perfil-avatar-upload label {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 6px 20px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-block;
      transition: 0.2s ease;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text-secondary);
    }

    .perfil-avatar-upload label:hover {
      border-color: var(--text-primary);
    }

    .perfil-form {
      padding: 10px 0;
    }

    .perfil-form-group {
      margin-bottom: 16px;
    }

    .perfil-form-group label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .perfil-form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      color: var(--text-primary);
      transition: 0.2s ease;
      outline: none;
    }

    .perfil-form-group input:focus {
      border-color: var(--text-primary);
    }

    .perfil-form-group input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .perfil-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 16px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin: 16px 0;
    }

    .perfil-stat {
      text-align: center;
    }

    .perfil-stat-number {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      color: var(--text-primary);
    }

    .perfil-stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .perfil-save-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.06em;
      margin-top: 8px;
    }

    .perfil-save-btn:hover {
      opacity: 0.85;
    }

    /* ----- RESPONSIVO ----- */
    @media (max-width: 400px) {
      .header {
        padding: 12px 16px 10px;
        gap: 10px;
      }

      .header-top {
        gap: 12px;
      }

      .logo {
        font-size: 1.4rem;
      }
      .logo span { font-size: 1.6rem; }

      .search-box {
        max-width: 180px;
        padding: 0 12px;
      }
      .search-box input {
        font-size: 0.85rem;
        padding: 10px 0;
      }
      .search-box i { font-size: 0.85rem; }

      .filter-btn {
        font-size: 0.8rem;
        padding: 4px 16px;
      }

      .carousel-wrapper {
        margin-top: 98px;
        margin-bottom: 72px;
        padding: 0 10px;
      }

      .card {
        min-width: 78vw;
        width: calc(100vw - 28px);
        height: calc(100vh - 190px);
        max-height: 480px;
      }

      .card-title { font-size: 1.8rem; }
      .card-content { bottom: 22px; left: 22px; right: 22px; }
      .tag { font-size: 0.75rem; padding: 3px 14px; }
      .pulse-text { font-size: 0.75rem; }

      .footer {
        padding: 10px 0 14px;
      }
      .footer-item i {
        font-size: 1.4rem;
      }
      .footer-item {
        font-size: 0.7rem;
      }

      .modal-card {
        padding: 16px 14px 20px;
      }
      .modal-title { font-size: 1.8rem; }
      .modal-sub { font-size: 0.8rem; }
      .modal-close {
        font-size: 1.4rem;
        top: 12px;
        right: 16px;
      }
      .modal-img-fav {
        width: 36px;
        height: 36px;
        font-size: 0.9rem;
        bottom: 10px;
        right: 10px;
      }

      .diary-content, .gallery-content, .perfil-content {
        padding: 20px 16px;
      }
      .diary-title, .gallery-title, .perfil-title { font-size: 1.3rem; }
      .diary-item-img { width: 50px; height: 50px; }
      .diary-item-name { font-size: 0.9rem; }

      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 8px;
      }

      .perfil-avatar-img, .perfil-avatar-placeholder {
        width: 90px;
        height: 90px;
        font-size: 2.5rem;
      }
      .perfil-stats { gap: 20px; }
      .perfil-stat-number { font-size: 1.2rem; }
    }

    @media (min-width: 401px) and (max-width: 600px) {
      .card {
        min-width: 260px;
        width: calc(100vw - 36px);
        height: calc(100vh - 200px);
        max-height: 520px;
      }
      .card-title { font-size: 2rem; }

      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }
    }

    .no-results {
      color: var(--text-muted);
      font-weight: 300;
      padding: 24px;
      text-align: center;
      width: 100%;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
    }

    .no-results i {
      opacity: 0.2;
      display: block;
      font-size: 2.5rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="header" role="banner">
    <div class="header-top">
      <div class="logo">
        Hair<span>Os</span>
        <span class="logo-divider"></span>
      </div>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Buscar corte..." aria-label="Buscar cortes">
      </div>
    </div>
    <div class="filter-group" id="filterGroup">
      <button class="filter-btn active" data-filter="todos">Todos</button>
      <button class="filter-btn" data-filter="curto">Curto</button>
      <button class="filter-btn" data-filter="medio">Médio</button>
      <button class="filter-btn" data-filter="longo">Longo</button>
    </div>
  </header>

  <!-- CARROSSEL -->
  <main class="carousel-wrapper">
    <div class="carousel-track" id="carouselTrack"></div>
  </main>

  <!-- FOOTER -->
  <footer class="footer" role="navigation">
    <button class="footer-item active" data-section="inicio" id="btnInicio">
      <i class="fas fa-home"></i>
      <span>Início</span>
    </button>
    <button class="footer-item" data-section="galeria" id="btnGaleria">
      <i class="fas fa-images"></i>
      <span>Galeria</span>
    </button>
    <button class="footer-item" data-section="favoritos" id="btnFavoritos">
      <i class="fas fa-heart"></i>
      <span>Favoritos</span>
    </button>
    <button class="footer-item" data-section="perfil" id="btnPerfil">
      <i class="fas fa-user"></i>
      <span>Perfil</span>
    </button>
  </footer>

  <!-- MODAL DE CORTE -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
      <button class="modal-close" id="modalClose" aria-label="Fechar modal"><i class="fas fa-times"></i></button>
      <div class="modal-title" id="modalTitle">Pixie</div>
      <div class="modal-sub" id="modalSub">curto • 3 imagens</div>
      <div class="modal-carousel" id="modalCarousel">
        <img id="modalImg" src="" alt="corte">
        <button class="modal-img-fav" id="modalImgFav" aria-label="Favoritar imagem">
          <i class="far fa-heart" id="modalImgFavIcon"></i>
        </button>
        <button class="modal-arrow left" id="modalPrev"><i class="fas fa-chevron-left"></i></button>
        <button class="modal-arrow right" id="modalNext"><i class="fas fa-chevron-right"></i></button>
      </div>
      <div class="modal-dots" id="modalDots"></div>
    </div>
  </div>

  <!-- MODAL GALERIA -->
  <div class="gallery-modal" id="galleryModal">
    <div class="gallery-content">
      <div class="gallery-header">
        <h2 class="gallery-title"><i class="fas fa-images" style="color: var(--accent); margin-right: 10px;"></i>Galeria</h2>
        <button class="gallery-close" id="galleryClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </div>

  <!-- MODAL DIÁRIO (FAVORITOS DE IMAGENS) -->
  <div class="diary-modal" id="diaryModal">
    <div class="diary-content">
      <div class="diary-header">
        <h2 class="diary-title"><i class="fas fa-heart" style="color: var(--accent); margin-right: 10px;"></i>Imagens Favoritas</h2>
        <button class="diary-close" id="diaryClose"><i class="fas fa-times"></i></button>
      </div>
      <div id="diaryList"></div>
    </div>
  </div>

  <!-- MODAL PERFIL -->
  <div class="perfil-modal" id="perfilModal">
    <div class="perfil-content">
      <div class="perfil-header">
        <h2 class="perfil-title"><i class="fas fa-user" style="color: var(--accent); margin-right: 10px;"></i>Meu Perfil</h2>
        <button class="perfil-close" id="perfilClose"><i class="fas fa-times"></i></button>
      </div>

      <div class="perfil-avatar">
        <img id="perfilAvatarImg" class="perfil-avatar-img" src="" alt="Avatar" style="display: none;">
        <div id="perfilAvatarPlaceholder" class="perfil-avatar-placeholder">
          <i class="fas fa-user"></i>
        </div>
        <div class="perfil-avatar-upload">
          <label for="avatarUpload">Alterar foto</label>
          <input type="file" id="avatarUpload" accept="image/*">
        </div>
      </div>

      <div class="perfil-form">
        <div class="perfil-form-group">
          <label>Nome</label>
          <input type="text" id="perfilNome" value="Usuário HairOs">
        </div>
        <div class="perfil-form-group">
          <label>Email</label>
          <input type="email" id="perfilEmail" value="usuario@hairos.com">
        </div>
        <div class="perfil-form-group">
          <label>Membro desde</label>
          <input type="text" id="perfilMembro" value="2024" disabled>
        </div>
      </div>

      <div class="perfil-stats">
        <div class="perfil-stat">
          <div class="perfil-stat-number" id="perfilFavCount">0</div>
          <div class="perfil-stat-label">Favoritos</div>
        </div>
        <div class="perfil-stat">
          <div class="perfil-stat-number">13</div>
          <div class="perfil-stat-label">Cortes</div>
        </div>
        <div class="perfil-stat">
          <div class="perfil-stat-number">34</div>
          <div class="perfil-stat-label">Visualizações</div>
        </div>
      </div>

      <button class="perfil-save-btn" id="perfilSaveBtn">Salvar alterações</button>
    </div>
  </div>

  <script>
    (function() {
      const cortes = [
        { id: 1, nome: "Pixie", tamanho: "curto", imagens: [
          "https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1560869713-a2b7f2b6a57d?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 2, nome: "Side Cut", tamanho: "curto", imagens: [
          "https://images.unsplash.com/photo-1562322140-8baeececf3df?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 3, nome: "Wolf", tamanho: "medio", imagens: [
          "https://images.unsplash.com/photo-1560869713-2b7f2b6a57d?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1531751782190-fc6f0f0c5e6e?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 4, nome: "Short Bob", tamanho: "curto", imagens: [
          "https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 5, nome: "Kitty", tamanho: "medio", imagens: [
          "https://images.unsplash.com/photo-1560869713-2b7f2b6a57d?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1531751782190-fc6f0f0c5e6e?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 6, nome: "Nirvana", tamanho: "medio", imagens: [
          "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1562322140-8baeececf3df?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 7, nome: "Long Bob", tamanho: "medio", imagens: [
          "https://images.unsplash.com/photo-1531751782190-fc6f0f0c5e6e?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1560869713-2b7f2b6a57d?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 8, nome: "Butterfly", tamanho: "longo", imagens: [
          "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1531751782190-fc6f0f0c5e6e?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 9, nome: "Blunt", tamanho: "medio", imagens: [
          "https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1562322140-8baeececf3df?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 10, nome: "Octopus", tamanho: "longo", imagens: [
          "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1531751782190-fc6f0f0c5e6e?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1560869713-2b7f2b6a57d?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 11, nome: "Curtain Bangs", tamanho: "medio", imagens: [
          "https://images.unsplash.com/photo-1562322140-8baeececf3df?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 12, nome: "Shag", tamanho: "longo", imagens: [
          "https://images.unsplash.com/photo-1531751782190-fc6f0f0c5e6e?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?w=400&h=600&fit=crop&crop=center&auto=format"
        ] },
        { id: 13, nome: "French Bob", tamanho: "curto", imagens: [
          "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1560869713-2b7f2b6a57d?w=400&h=600&fit=crop&crop=center&auto=format",
          "https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format"
        ] }
      ];

      const track = document.getElementById('carouselTrack');
      const searchInput = document.getElementById('searchInput');
      const filterGroup = document.getElementById('filterGroup');
      const modalOverlay = document.getElementById('modalOverlay');
      const modalClose = document.getElementById('modalClose');
      const modalTitle = document.getElementById('modalTitle');
      const modalSub = document.getElementById('modalSub');
      const modalImg = document.getElementById('modalImg');
      const modalPrev = document.getElementById('modalPrev');
      const modalNext = document.getElementById('modalNext');
      const modalDots = document.getElementById('modalDots');
      const modalImgFav = document.getElementById('modalImgFav');
      const modalImgFavIcon = document.getElementById('modalImgFavIcon');

      const galleryModal = document.getElementById('galleryModal');
      const galleryClose = document.getElementById('galleryClose');
      const galleryGrid = document.getElementById('galleryGrid');

      const diaryModal = document.getElementById('diaryModal');
      const diaryClose = document.getElementById('diaryClose');
      const diaryList = document.getElementById('diaryList');

      const perfilModal = document.getElementById('perfilModal');
      const perfilClose = document.getElementById('perfilClose');
      const perfilFavCount = document.getElementById('perfilFavCount');
      const perfilAvatarImg = document.getElementById('perfilAvatarImg');
      const perfilAvatarPlaceholder = document.getElementById('perfilAvatarPlaceholder');
      const avatarUpload = document.getElementById('avatarUpload');
      const perfilNome = document.getElementById('perfilNome');
      const perfilEmail = document.getElementById('perfilEmail');
      const perfilSaveBtn = document.getElementById('perfilSaveBtn');

      const btnInicio = document.getElementById('btnInicio');
      const btnGaleria = document.getElementById('btnGaleria');
      const btnFavoritos = document.getElementById('btnFavoritos');
      const btnPerfil = document.getElementById('btnPerfil');

      let currentModalData = null;
      let currentImageIndex = 0;
      let currentFilter = 'todos';
      let searchTerm = '';
      // Favoritos agora salvam: { corteId, imageIndex, imageUrl, corteNome }
      let favorites = JSON.parse(localStorage.getItem('hairOsImageFavorites') || '[]');
      let profileData = JSON.parse(localStorage.getItem('hairOsProfile') || '{"nome":"Usuário HairOs","email":"usuario@hairos.com","avatar":""}');

      function saveFavorites() {
        localStorage.setItem('hairOsImageFavorites', JSON.stringify(favorites));
        updateFavCount();
        updatePerfilFavCount();
        renderCards();
        renderGallery();
        renderDiary();
      }

      function saveProfile() {
        localStorage.setItem('hairOsProfile', JSON.stringify(profileData));
      }

      function updateFavCount() {
        const favCount = document.querySelector('.footer-item[data-section="favoritos"] span');
        if (favCount) {
          favCount.textContent = favorites.length > 0 ? `Favoritos (${favorites.length})` : 'Favoritos';
        }
      }

      function updatePerfilFavCount() {
        if (perfilFavCount) {
          perfilFavCount.textContent = favorites.length;
        }
      }

      function isImageFavorite(corteId, imageIndex) {
        return favorites.some(f => f.corteId === corteId && f.imageIndex === imageIndex);
      }

      function toggleImageFavorite(corteId, imageIndex, imageUrl, corteNome) {
        const index = favorites.findIndex(f => f.corteId === corteId && f.imageIndex === imageIndex);
        if (index > -1) {
          favorites.splice(index, 1);
        } else {
          favorites.push({ corteId, imageIndex, imageUrl, corteNome });
        }
        saveFavorites();
        updateModalFavButton();
        renderCards();
        renderGallery();
        renderDiary();
      }

      function updateModalFavButton() {
        if (!currentModalData) return;
        const isFav = isImageFavorite(currentModalData.id, currentImageIndex);
        modalImgFavIcon.className = isFav ? 'fas fa-heart' : 'far fa-heart';
        modalImgFav.classList.toggle('fav', isFav);
      }

      function renderCards() {
        const filtered = cortes.filter(c => {
          const matchSize = currentFilter === 'todos' || c.tamanho === currentFilter;
          const matchSearch = c.nome.toLowerCase().includes(searchTerm.toLowerCase());
          return matchSize && matchSearch;
        });

        if (filtered.length === 0) {
          track.innerHTML = `<div class="no-results"><i class="fas fa-cut"></i>Nenhum corte encontrado</div>`;
          return;
        }

        let html = '';
        filtered.forEach(c => {
          const firstImg = c.imagens[0] || 'https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format';
          const hasFav = favorites.some(f => f.corteId === c.id);
          html += `
            <div class="card" data-id="${c.id}" style="background-image: url('${firstImg}');">
              <div class="card-overlay"></div>
              <div class="card-content">
                <div class="card-title">${c.nome}</div>
                <div class="card-tags">
                  <span class="tag">${c.tamanho}</span>
                  ${hasFav ? '<span class="tag tag-fav"><i class="fas fa-heart" style="margin-right: 4px;"></i> Favorito</span>' : ''}
                </div>
                <div class="pulse-text"><i class="fas fa-hand-pointer"></i> Clique para ver mais</div>
              </div>
            </div>
          `;
        });
        track.innerHTML = html;

        document.querySelectorAll('.card').forEach(el => {
          el.addEventListener('click', function(e) {
            const id = parseInt(this.dataset.id);
            const corte = cortes.find(c => c.id === id);
            if (corte) openModal(corte);
          });
        });
      }

      function renderGallery() {
        const filtered = cortes.filter(c => {
          const matchSize = currentFilter === 'todos' || c.tamanho === currentFilter;
          const matchSearch = c.nome.toLowerCase().includes(searchTerm.toLowerCase());
          return matchSize && matchSearch;
        });

        if (filtered.length === 0) {
          galleryGrid.innerHTML = `
            <div class="gallery-empty">
              <i class="fas fa-images"></i>
              <p>Nenhum corte encontrado na galeria.</p>
            </div>
          `;
          return;
        }

        let html = '';
        filtered.forEach(c => {
          const firstImg = c.imagens[0] || 'https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format';
          const hasFav = favorites.some(f => f.corteId === c.id);
          html += `
            <div class="gallery-item" data-id="${c.id}">
              <img src="${firstImg}" alt="${c.nome}">
              <div class="gallery-item-overlay">
                <div class="gallery-item-name">${c.nome}</div>
                <div class="gallery-item-tag">${c.tamanho} ${hasFav ? '❤' : ''}</div>
              </div>
            </div>
          `;
        });
        galleryGrid.innerHTML = html;

        document.querySelectorAll('.gallery-item').forEach(el => {
          el.addEventListener('click', function() {
            const id = parseInt(this.dataset.id);
            const corte = cortes.find(c => c.id === id);
            if (corte) {
              closeGallery();
              openModal(corte);
            }
          });
        });
      }

      function openModal(corte) {
        currentModalData = corte;
        currentImageIndex = 0;
        modalTitle.textContent = corte.nome;
        modalSub.textContent = `${corte.tamanho} • ${corte.imagens.length} imagens`;
        updateModalImage();
        renderDots();
        updateModalFavButton();
        modalOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        modalOverlay.classList.remove('open');
        document.body.style.overflow = '';
        currentModalData = null;
      }

      function updateModalImage() {
        if (!currentModalData) return;
        const imgUrl = currentModalData.imagens[currentImageIndex] || currentModalData.imagens[0];
        modalImg.src = imgUrl;
        updateModalFavButton();
        document.querySelectorAll('.dot').forEach((d, i) => {
          d.classList.toggle('active', i === currentImageIndex);
        });
      }

      function renderDots() {
        if (!currentModalData) return;
        const total = currentModalData.imagens.length;
        let dotsHtml = '';
        for (let i = 0; i < total; i++) {
          dotsHtml += `<button class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></button>`;
        }
        modalDots.innerHTML = dotsHtml;
        document.querySelectorAll('.dot').forEach(dot => {
          dot.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index);
            if (!isNaN(idx) && currentModalData && idx < currentModalData.imagens.length) {
              currentImageIndex = idx;
              updateModalImage();
            }
          });
        });
      }

      function navigateModal(delta) {
        if (!currentModalData) return;
        const total = currentModalData.imagens.length;
        currentImageIndex = (currentImageIndex + delta + total) % total;
        updateModalImage();
      }

      function renderDiary() {
        if (favorites.length === 0) {
          diaryList.innerHTML = `
            <div class="diary-empty">
              <i class="far fa-heart"></i>
              <p>Seu álbum de imagens favoritas está vazio.</p>
              <p style="font-size: 0.8rem; margin-top: 8px;">Explore os cortes e favorite imagens específicas!</p>
            </div>
          `;
          return;
        }

        let html = '';
        favorites.forEach((fav, idx) => {
          html += `
            <div class="diary-item">
              <img class="diary-item-img" src="${fav.imageUrl}" alt="${fav.corteNome}" data-corteid="${fav.corteId}" data-imageindex="${fav.imageIndex}">
              <div class="diary-item-info">
                <div class="diary-item-name">${fav.corteNome}</div>
                <div class="diary-item-tag">Imagem ${fav.imageIndex + 1}</div>
              </div>
              <button class="diary-item-remove" data-index="${idx}" title="Remover dos favoritos">
                <i class="fas fa-times"></i>
              </button>
            </div>
          `;
        });
        diaryList.innerHTML = html;

        document.querySelectorAll('.diary-item-img').forEach(img => {
          img.addEventListener('click', function() {
            const corteId = parseInt(this.dataset.corteid);
            const imageIndex = parseInt(this.dataset.imageindex);
            const corte = cortes.find(c => c.id === corteId);
            if (corte) {
              closeDiary();
              openModal(corte);
              // Navegar para a imagem específica
              setTimeout(() => {
                currentImageIndex = imageIndex;
                updateModalImage();
              }, 100);
            }
          });
        });

        document.querySelectorAll('.diary-item-remove').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const index = parseInt(this.dataset.index);
            favorites.splice(index, 1);
            saveFavorites();
            renderDiary();
            renderCards();
            renderGallery();
            if (currentModalData) {
              updateModalFavButton();
            }
          });
        });
      }

      function openGallery() {
        renderGallery();
        galleryModal.classList.add('open');
        document.body.style.overflow = 'hidden';
        updateFooterActive('galeria');
      }

      function closeGallery() {
        galleryModal.classList.remove('open');
        document.body.style.overflow = '';
      }

      function openDiary() {
        renderDiary();
        diaryModal.classList.add('open');
        document.body.style.overflow = 'hidden';
        updateFooterActive('favoritos');
      }

      function closeDiary() {
        diaryModal.classList.remove('open');
        document.body.style.overflow = '';
      }

      function openPerfil() {
        loadProfile();
        updatePerfilFavCount();
        perfilModal.classList.add('open');
        document.body.style.overflow = 'hidden';
        updateFooterActive('perfil');
      }

      function closePerfil() {
        perfilModal.classList.remove('open');
        document.body.style.overflow = '';
      }

      function loadProfile() {
        const data = JSON.parse(localStorage.getItem('hairOsProfile') || '{"nome":"Usuário HairOs","email":"usuario@hairos.com","avatar":""}');
        perfilNome.value = data.nome || 'Usuário HairOs';
        perfilEmail.value = data.email || 'usuario@hairos.com';
        if (data.avatar) {
          perfilAvatarImg.src = data.avatar;
          perfilAvatarImg.style.display = 'block';
          perfilAvatarPlaceholder.style.display = 'none';
        } else {
          perfilAvatarImg.style.display = 'none';
          perfilAvatarPlaceholder.style.display = 'flex';
        }
      }

      function updateFooterActive(section) {
        document.querySelectorAll('.footer-item').forEach(item => {
          item.classList.toggle('active', item.dataset.section === section);
        });
      }

      // FILTROS
      filterGroup.addEventListener('click', function(e) {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderCards();
        renderGallery();
        updateFooterActive('inicio');
      });

      // BUSCA
      searchInput.addEventListener('input', function() {
        searchTerm = this.value.trim();
        renderCards();
        renderGallery();
        updateFooterActive('inicio');
      });

      // MODAL
      modalClose.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) closeModal();
      });

      // Botão de favoritar imagem no modal
      modalImgFav.addEventListener('click', function(e) {
        e.stopPropagation();
        if (currentModalData) {
          const imgUrl = currentModalData.imagens[currentImageIndex] || currentModalData.imagens[0];
          toggleImageFavorite(
            currentModalData.id,
            currentImageIndex,
            imgUrl,
            currentModalData.nome
          );
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closeModal();
          closeGallery();
          closeDiary();
          closePerfil();
        }
        if (e.key === 'ArrowLeft' && modalOverlay.classList.contains('open')) {
          e.preventDefault();
          navigateModal(-1);
        }
        if (e.key === 'ArrowRight' && modalOverlay.classList.contains('open')) {
          e.preventDefault();
          navigateModal(1);
        }
      });

      modalPrev.addEventListener('click', function(e) {
        e.stopPropagation();
        navigateModal(-1);
      });

      modalNext.addEventListener('click', function(e) {
        e.stopPropagation();
        navigateModal(1);
      });

      // FOOTER NAVEGAÇÃO
      btnInicio.addEventListener('click', function() {
        updateFooterActive('inicio');
        document.querySelector('.carousel-wrapper').scrollIntoView({ behavior: 'smooth' });
      });

      btnGaleria.addEventListener('click', function() {
        openGallery();
      });

      btnFavoritos.addEventListener('click', function() {
        openDiary();
      });

      btnPerfil.addEventListener('click', function() {
        openPerfil();
      });

      // GALERIA
      galleryClose.addEventListener('click', closeGallery);
      galleryModal.addEventListener('click', function(e) {
        if (e.target === galleryModal) closeGallery();
      });

      // DIÁRIO
      diaryClose.addEventListener('click', closeDiary);
      diaryModal.addEventListener('click', function(e) {
        if (e.target === diaryModal) closeDiary();
      });

      // PERFIL
      perfilClose.addEventListener('click', closePerfil);
      perfilModal.addEventListener('click', function(e) {
        if (e.target === perfilModal) closePerfil();
      });

      // UPLOAD DE AVATAR
      avatarUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(event) {
            const imageUrl = event.target.result;
            perfilAvatarImg.src = imageUrl;
            perfilAvatarImg.style.display = 'block';
            perfilAvatarPlaceholder.style.display = 'none';
            profileData.avatar = imageUrl;
            saveProfile();
          };
          reader.readAsDataURL(file);
        }
      });

      // SALVAR PERFIL
      perfilSaveBtn.addEventListener('click', function() {
        profileData.nome = perfilNome.value.trim() || 'Usuário HairOs';
        profileData.email = perfilEmail.value.trim() || 'usuario@hairos.com';
        saveProfile();
        alert('Perfil atualizado com sucesso!');
        closePerfil();
      });

      // INICIALIZAÇÃO
      updateFavCount();
      updatePerfilFavCount();
      loadProfile();
      renderCards();
    })();
  </script>
</body>
</html>

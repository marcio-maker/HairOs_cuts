<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>HairOs · Cortes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #faf8f5;
      --bg-card: #ffffff;
      --text-primary: #1c1a17;
      --text-secondary: #6b6560;
      --text-muted: #a69f98;
      --accent: #c0392b;
      --accent-light: #e74c3c;
      --border: #e8e3dd;
      --shadow: 0 4px 24px rgba(0,0,0,0.04);
      --header-height: 0px;
      --footer-height: 0px;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-weight: 400;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      background: var(--bg-primary);
      border-bottom: 2px solid var(--border);
      padding: 16px 24px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .logo span {
      font-weight: 400;
      color: var(--accent);
      font-style: italic;
      font-size: 2rem;
    }

    .logo-divider {
      width: 24px;
      height: 1px;
      background: var(--border);
      margin: 0 8px;
    }

    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0 16px;
      transition: 0.2s ease;
      max-width: 340px;
    }

    .search-box:focus-within {
      border-color: var(--text-primary);
    }

    .search-box i {
      color: var(--text-muted);
      font-size: 1rem;
      margin-right: 12px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      padding: 12px 0;
      width: 100%;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
      font-weight: 300;
    }

    .filter-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 22px;
      font-size: 0.9rem;
      font-weight: 500;
      font-family: 'Space Grotesk', sans-serif;
      transition: 0.2s ease;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }

    .filter-btn.active {
      color: var(--text-primary);
      border-color: var(--text-primary);
      background: var(--bg-card);
    }

    .filter-btn:hover:not(.active) {
      color: var(--text-secondary);
      border-color: var(--border);
    }

    .carousel-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0 20px;
    }

    .carousel-track {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      overflow-y: visible;
      padding: 8px 4px 20px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      width: 100%;
      justify-content: flex-start;
      align-items: center;
      height: 100%;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .card {
      flex: 0 0 auto;
      width: calc(100vw - 48px);
      max-width: 340px;
      height: 100%;
      max-height: 600px;
      min-height: 400px;
      border-radius: 0;
      background: var(--bg-card);
      position: relative;
      overflow: hidden;
      scroll-snap-align: center;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.4s ease;
      cursor: pointer;
      border: 1px solid var(--border);
      background-size: cover;
      background-position: center;
      min-width: 80vw;
    }

    @media (min-width: 420px) {
      .card {
        min-width: 300px;
        width: 300px;
      }
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    }

    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 55%;
      background: linear-gradient(to top, rgba(28, 26, 23, 0.9) 0%, rgba(28, 26, 23, 0.1) 60%, transparent 100%);
      pointer-events: none;
    }

    .card-content {
      position: absolute;
      bottom: 28px;
      left: 28px;
      right: 28px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      z-index: 2;
    }

    .card-title {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 2.2rem;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 2px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 4px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: lowercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.8);
      display: inline-flex;
      align-items: center;
    }

    .tag-fav {
      background: rgba(192, 57, 43, 0.2);
      border-color: rgba(192, 57, 43, 0.3);
      color: #c0392b;
    }

    .pulse-text {
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadePulse 3s ease-in-out infinite;
    }

    .pulse-text i {
      font-size: 0.85rem;
    }

    @keyframes fadePulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      background: var(--bg-primary);
      border-top: 2px solid var(--border);
      padding: 12px 0 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0;
    }

    .footer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: lowercase;
      transition: 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 12px;
    }

    .footer-item i {
      font-size: 1.6rem;
      margin-bottom: 2px;
      transition: 0.2s ease;
    }

    .footer-item.active {
      color: var(--text-primary);
    }

    .footer-item.active i {
      color: var(--accent);
    }

    .footer-item:hover:not(.active) i {
      color: var(--text-secondary);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(28, 26, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .modal-overlay.open {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: var(--bg-primary);
      width: 100%;
      max-width: 440px;
      max-height: 92vh;
      padding: 28px 24px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 480px) {
      .modal-card {
        max-width: 100%;
        max-height: 96vh;
        padding: 20px 16px 22px;
      }
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.6rem;
      cursor: pointer;
      transition: 0.2s ease;
      line-height: 1;
      padding: 4px 8px;
      z-index: 15;
    }

    .modal-close:hover {
      color: var(--text-primary);
    }

    .modal-title {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 2.2rem;
      color: var(--text-primary);
      margin: 2px 0 0;
      letter-spacing: -0.02em;
    }

    .modal-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: lowercase;
    }

    .modal-carousel {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      background: var(--bg-card);
      overflow: hidden;
      margin: 2px 0 14px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      touch-action: pan-y;
    }

    .modal-carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s ease;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .modal-img-fav {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(28, 26, 23, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: 0.2s ease;
    }

    .modal-img-fav:hover {
      transform: scale(1.1);
      background: rgba(28, 26, 23, 0.9);
    }

    .modal-img-fav.fav {
      color: var(--accent);
      background: rgba(192, 57, 43, 0.3);
      border-color: rgba(192, 57, 43, 0.4);
    }

    .modal-img-fav.fav:hover {
      background: rgba(192, 57, 43, 0.4);
    }

    .modal-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(28, 26, 23, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.06);
      color: #ffffff;
      font-size: 1.6rem;
      padding: 8px 16px;
      cursor: pointer;
      z-index: 10;
      transition: 0.2s ease;
    }

    .modal-arrow:hover {
      background: rgba(28, 26, 23, 0.8);
    }

    .modal-arrow.left { left: 8px; }
    .modal-arrow.right { right: 8px; }

    @media (max-width: 479px) {
      .modal-arrow {
        font-size: 1.2rem;
        padding: 6px 12px;
      }
      .modal-img-fav {
        width: 40px;
        height: 40px;
        font-size: 1rem;
        bottom: 12px;
        right: 12px;
      }
    }

    .modal-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      padding-bottom: 2px;
      flex-shrink: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--border);
      transition: 0.25s ease;
      cursor: pointer;
      border: none;
      padding: 0;
    }

    .dot.active {
      background: var(--text-primary);
      width: 28px;
    }

    .gallery-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(28, 26, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .gallery-modal.open {
      display: flex;
    }

    .gallery-content {
      background: var(--bg-primary);
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      padding: 28px 24px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
      position: relative;
      overflow-y: auto;
    }

    .gallery-content::-webkit-scrollbar {
      width: 4px;
    }

    .gallery-content::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }

    .gallery-title {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 1.6rem;
      color: var(--text-primary);
    }

    .gallery-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.6rem;
      cursor: pointer;
      transition: 0.2s ease;
      padding: 4px 8px;
    }

    .gallery-close:hover {
      color: var(--text-primary);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 3/4;
      background: var(--bg-card);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .gallery-item:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      z-index: 2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-item-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 8px 10px;
      background: linear-gradient(to top, rgba(28, 26, 23, 0.8), transparent);
    }

    .gallery-item-name {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 0.85rem;
      color: #ffffff;
    }

    .gallery-item-tag {
      font-size: 0.55rem;
      color: rgba(255,255,255,0.6);
      text-transform: lowercase;
      letter-spacing: 0.06em;
    }

    .gallery-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
      font-size: 0.95rem;
    }

    .gallery-empty i {
      font-size: 3rem;
      opacity: 0.2;
      display: block;
      margin-bottom: 16px;
    }

    .diary-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(28, 26, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .diary-modal.open {
      display: flex;
    }

    .diary-content {
      background: var(--bg-primary);
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      padding: 28px 24px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
      position: relative;
      overflow-y: auto;
    }

    .diary-content::-webkit-scrollbar {
      width: 4px;
    }

    .diary-content::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .diary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }

    .diary-title {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 1.6rem;
      color: var(--text-primary);
    }

    .diary-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.6rem;
      cursor: pointer;
      transition: 0.2s ease;
      padding: 4px 8px;
    }

    .diary-close:hover {
      color: var(--text-primary);
    }

    .diary-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .diary-item:last-child {
      border-bottom: none;
    }

    .diary-item-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      cursor: pointer;
    }

    .diary-item-img:hover {
      opacity: 0.8;
    }

    .diary-item-info {
      flex: 1;
    }

    .diary-item-name {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 1rem;
      color: var(--text-primary);
    }

    .diary-item-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: lowercase;
      letter-spacing: 0.06em;
    }

    .diary-item-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s ease;
      padding: 4px 8px;
    }

    .diary-item-remove:hover {
      color: var(--accent);
    }

    .diary-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
      font-size: 0.95rem;
    }

    .diary-empty i {
      font-size: 3rem;
      opacity: 0.2;
      display: block;
      margin-bottom: 16px;
    }

    /* ============================================================
       CONTATO - NOVA PÁGINA (substituindo o perfil)
       ============================================================ */
    .contato-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(28, 26, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .contato-modal.open {
      display: flex;
    }

    .contato-content {
      background: var(--bg-primary);
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      padding: 28px 24px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
      position: relative;
      overflow-y: auto;
    }

    .contato-content::-webkit-scrollbar {
      width: 4px;
    }

    .contato-content::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .contato-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }

    .contato-title {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 1.6rem;
      color: var(--text-primary);
    }

    .contato-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.6rem;
      cursor: pointer;
      transition: 0.2s ease;
      padding: 4px 8px;
    }

    .contato-close:hover {
      color: var(--text-primary);
    }

    .contato-body p {
      font-size: clamp(14px, 3vw, 16px);
      color: var(--text-secondary);
      font-weight: 300;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .contato-social {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 8px 0 16px 0;
      flex-wrap: wrap;
    }

    .contato-social a {
      color: var(--text-muted);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 50%;
      border: 1px solid var(--border);
      width: 44px;
      height: 44px;
      text-decoration: none;
      font-size: 1.2rem;
    }

    .contato-social a:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: scale(1.05);
      background: rgba(192, 57, 43, 0.05);
    }

    .contato-social a i {
      font-size: 1.2rem;
    }

    .contato-divider {
      border-top: 1px solid var(--border);
      margin: 8px 0 14px 0;
    }

    /* PIX CARD */
    .contato-pix-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 16px 14px 18px 14px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 16px rgba(0,0,0,0.04);
      text-align: center;
      margin-bottom: 14px;
    }

    .contato-pix-card .pix-label {
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .contato-pix-card .pix-qr {
      background: #ffffff;
      border-radius: 12px;
      padding: 8px;
      display: inline-block;
      margin: 0 auto 6px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .contato-pix-card .pix-qr img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      display: block;
    }

    .contato-pix-card .pix-key-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(192, 57, 43, 0.06);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 4px 6px 4px 14px;
      margin: 4px auto 0 auto;
      max-width: 100%;
      width: fit-content;
    }

    .contato-pix-card .pix-key-wrap span {
      font-size: clamp(12px, 2.6vw, 14px);
      color: var(--text-secondary);
      font-weight: 400;
      word-break: break-all;
    }

    .contato-pix-card .pix-key-wrap .copy-btn {
      background: var(--accent);
      border: none;
      border-radius: 100px;
      padding: 4px 14px;
      font-size: clamp(11px, 2.4vw, 13px);
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Space Grotesk', sans-serif;
      white-space: nowrap;
      min-height: 28px;
    }

    .contato-pix-card .pix-key-wrap .copy-btn:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }

    .contato-pix-card .pix-help {
      font-size: clamp(12px, 2.6vw, 14px);
      color: var(--text-muted);
      font-weight: 300;
      margin-top: 8px;
      letter-spacing: 0.04em;
    }

    /* FORMULÁRIO */
    .contato-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .contato-form label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 500;
    }

    .contato-form input,
    .contato-form textarea {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: clamp(14px, 3vw, 16px);
      outline: none;
      transition: all 0.3s ease;
      width: 100%;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      min-height: 36px;
    }

    .contato-form input:focus,
    .contato-form textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.1);
    }

    .contato-form input.error,
    .contato-form textarea.error {
      border-color: #ff4757;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .contato-form textarea {
      min-height: 80px;
      resize: vertical;
    }

    .contato-form .submit-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 12px;
      color: #ffffff;
      font-size: clamp(14px, 3vw, 16px);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      min-height: 44px;
      margin-top: 4px;
    }

    .contato-form .submit-btn:hover {
      opacity: 0.85;
      transform: scale(1.01);
    }

    .contato-form .submit-btn:active {
      transform: scale(0.98);
    }

    .contato-form .form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .contato-form .form-row .field-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 500;
    }

    @media (max-width: 400px) {

      }

      .card {

        min-height: 360px;
      }

      .card-title { font-size: 1.8rem; }
      .card-content { bottom: 22px; left: 22px; right: 22px; }
      .tag { font-size: 0.75rem; padding: 3px 14px; }
      .pulse-text { font-size: 0.75rem; }

      .footer {
        padding: 10px 0 14px;
      }
      .footer-item i {
        font-size: 1.4rem;
      }
      .footer-item {
        font-size: 0.7rem;
      }

      .modal-card {
        padding: 16px 14px 20px;
      }
      .modal-title { font-size: 1.8rem; }
      .modal-sub { font-size: 0.8rem; }
      .modal-close {
        font-size: 1.4rem;
        top: 12px;
        right: 16px;
      }
      .modal-img-fav {

        height: 36px;

            "https://i.pinimg.com/736x/4c/37/56/4c37568c50b992cd4cbe53f306a5b651.jpg",

      ];

      const track = document.getElementById('carouselTrack');
      const searchInput = document.getElementById('searchInput');
      const filterGroup = document.getElementById('filterGroup');
      const modalOverlay = document.getElementById('modalOverlay');
      const modalClose = document.getElementById('modalClose');
      const modalTitle = document.getElementById('modalTitle');
      const modalSub = document.getElementById('modalSub');
      const modalImg = document.getElementById('modalImg');
      const modalPrev = document.getElementById('modalPrev');
      const modalNext = document.getElementById('modalNext');
      const modalDots = document.getElementById('modalDots');
      const modalImgFav = document.getElementById('modalImgFav');
      const modalImgFavIcon = document.getElementById('modalImgFavIcon');
      const modalCarousel = document.getElementById('modalCarousel');

      const galleryModal = document.getElementById('galleryModal');
      const galleryClose = document.getElementById('galleryClose');
      const galleryGrid = document.getElementById('galleryGrid');

      const diaryModal = document.getElementById('diaryModal');
      const diaryClose = document.getElementById('diaryClose');
      const diaryList = document.getElementById('diaryList');

      const contatoModal = document.getElementById('contatoModal');
      const contatoClose = document.getElementById('contatoClose');

      const btnInicio = document.getElementById('btnInicio');
      const btnGaleria = document.getElementById('btnGaleria');
      const btnFavoritos = document.getElementById('btnFavoritos');
      const btnContato = document.getElementById('btnContato');

      const header = document.getElementById('mainHeader');
      const footer = document.getElementById('mainFooter');
      const carouselWrapper = document.getElementById('carouselWrapper');

      let currentModalData = null;
      let currentImageIndex = 0;
      let currentFilter = 'todos';
      let searchTerm = '';
      let favorites = JSON.parse(localStorage.getItem('hairOsImageFavorites') || '[]');

      let touchStartX = 0;
      let touchStartY = 0;
      let isSwiping = false;

      function adjustCarouselPadding() {
        const headerHeight = header.offsetHeight;
        const footerHeight = footer.offsetHeight;
        
        carouselWrapper.style.paddingTop = headerHeight + 'px';
        carouselWrapper.style.paddingBottom = footerHeight + 'px';
        
        const availableHeight = window.innerHeight - headerHeight - footerHeight - 40;
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
          card.style.maxHeight = Math.min(600, availableHeight) + 'px';
          card.style.minHeight = Math.min(400, availableHeight * 0.7) + 'px';
        });
      }

      function saveFavorites() {
        localStorage.setItem('hairOsImageFavorites', JSON.stringify(favorites));
        updateFavCount();
        renderCards();
        renderGallery();
        renderDiary();
      }

      function updateFavCount() {
        const favCount = document.querySelector('.footer-item[data-section="favoritos"] span');
        if (favCount) {
          favCount.textContent = favorites.length > 0 ? `Favoritos (${favorites.length})` : 'Favoritos';
        }
      }

      function isImageFavorite(corteId, imageIndex) {
        return favorites.some(f => f.corteId === corteId && f.imageIndex === imageIndex);
      }

      function toggleImageFavorite(corteId, imageIndex, imageUrl, corteNome) {
        const index = favorites.findIndex(f => f.corteId === corteId && f.imageIndex === imageIndex);
        if (index > -1) {
          favorites.splice(index, 1);
        } else {
          favorites.push({ corteId, imageIndex, imageUrl, corteNome });
        }
        saveFavorites();
        updateModalFavButton();
        renderCards();
        renderGallery();
        renderDiary();
      }

      function updateModalFavButton() {
        if (!currentModalData) return;
        const isFav = isImageFavorite(currentModalData.id, currentImageIndex);
        modalImgFavIcon.className = isFav ? 'fas fa-heart' : 'far fa-heart';
        modalImgFav.classList.toggle('fav', isFav);
      }

      function renderCards() {
        const filtered = cortes.filter(c => {
          const matchSize = currentFilter === 'todos' || c.tamanho === currentFilter;
          const matchSearch = c.nome.toLowerCase().includes(searchTerm.toLowerCase());
          return matchSize && matchSearch;
        });

        if (filtered.length === 0) {
          track.innerHTML = `<div class="no-results"><i class="fas fa-cut"></i>Nenhum corte encontrado</div>`;
          return;
        }

        let html = '';
        filtered.forEach(c => {
          const firstImg = c.imagens[0] || 'https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format';
          const hasFav = favorites.some(f => f.corteId === c.id);
          html += `
            <div class="card" data-id="${c.id}" style="background-image: url('${firstImg}');">
              <div class="card-overlay"></div>
              <div class="card-content">
                <div class="card-title">${c.nome}</div>
                <div class="card-tags">
                  <span class="tag">${c.tamanho}</span>
                  ${hasFav ? '<span class="tag tag-fav"><i class="fas fa-heart" style="margin-right: 4px;"></i> Favorito</span>' : ''}
                </div>
                <div class="pulse-text"><i class="fas fa-hand-pointer"></i> Clique para ver mais</div>
              </div>
            </div>
          `;
        });
        track.innerHTML = html;

        setTimeout(adjustCarouselPadding, 50);

        document.querySelectorAll('.card').forEach(el => {
          el.addEventListener('click', function(e) {
            const id = parseInt(this.dataset.id);
            const corte = cortes.find(c => c.id === id);
            if (corte) openModal(corte);
          });
        });
      }

      function renderGallery() {
        const filtered = cortes.filter(c => {
          const matchSize = currentFilter === 'todos' || c.tamanho === currentFilter;
          const matchSearch = c.nome.toLowerCase().includes(searchTerm.toLowerCase());
          return matchSize && matchSearch;
        });

        if (filtered.length === 0) {
          galleryGrid.innerHTML = `
            <div class="gallery-empty">
              <i class="fas fa-images"></i>
              <p>Nenhum corte encontrado na galeria.</p>
            </div>
          `;
          return;
        }

        let html = '';
        filtered.forEach(c => {
          const firstImg = c.imagens[0] || 'https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=400&h=600&fit=crop&crop=center&auto=format';
          const hasFav = favorites.some(f => f.corteId === c.id);
          html += `
            <div class="gallery-item" data-id="${c.id}">
              <img src="${firstImg}" alt="${c.nome}">
              <div class="gallery-item-overlay">
                <div class="gallery-item-name">${c.nome}</div>
                <div class="gallery-item-tag">${c.tamanho} ${hasFav ? '❤' : ''}</div>
              </div>
            </div>
          `;
        });
        galleryGrid.innerHTML = html;

        document.querySelectorAll('.gallery-item').forEach(el => {
          el.addEventListener('click', function() {
            const id = parseInt(this.dataset.id);
            const corte = cortes.find(c => c.id === id);
            if (corte) {
              closeGallery();
              openModal(corte);
            }
          });
        });
      }

      function openModal(corte) {
        currentModalData = corte;
        currentImageIndex = 0;
        modalTitle.textContent = corte.nome;
        modalSub.textContent = `${corte.tamanho} • ${corte.imagens.length} imagens`;
        updateModalImage();
        renderDots();
        updateModalFavButton();
        modalOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        modalOverlay.classList.remove('open');
        document.body.style.overflow = '';
        currentModalData = null;
      }

      function updateModalImage() {
        if (!currentModalData) return;
        const imgUrl = currentModalData.imagens[currentImageIndex] || currentModalData.imagens[0];
        modalImg.src = imgUrl;
        updateModalFavButton();
        document.querySelectorAll('.dot').forEach((d, i) => {
          d.classList.toggle('active', i === currentImageIndex);
        });
      }

      function renderDots() {
        if (!currentModalData) return;
        const total = currentModalData.imagens.length;
        let dotsHtml = '';
        for (let i = 0; i < total; i++) {
          dotsHtml += `<button class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></button>`;
        }
        modalDots.innerHTML = dotsHtml;
        document.querySelectorAll('.dot').forEach(dot => {
          dot.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index);
            if (!isNaN(idx) && currentModalData && idx < currentModalData.imagens.length) {
              currentImageIndex = idx;
              updateModalImage();
            }
          });
        });
      }

      function navigateModal(delta) {
        if (!currentModalData) return;
        const total = currentModalData.imagens.length;
        currentImageIndex = (currentImageIndex + delta + total) % total;
        updateModalImage();
      }

      function renderDiary() {
        if (favorites.length === 0) {
          diaryList.innerHTML = `
            <div class="diary-empty">
              <i class="far fa-heart"></i>
              <p>Seu álbum de imagens favoritas está vazio.</p>
              <p style="font-size: 0.8rem; margin-top: 8px;">Explore os cortes e favorite imagens específicas!</p>
            </div>
          `;
          return;
        }

        let html = '';
        favorites.forEach((fav, idx) => {
          html += `
            <div class="diary-item">
              <img class="diary-item-img" src="${fav.imageUrl}" alt="${fav.corteNome}" data-corteid="${fav.corteId}" data-imageindex="${fav.imageIndex}">
              <div class="diary-item-info">
                <div class="diary-item-name">${fav.corteNome}</div>
                <div class="diary-item-tag">Imagem ${fav.imageIndex + 1}</div>
              </div>
              <button class="diary-item-remove" data-index="${idx}" title="Remover dos favoritos">
                <i class="fas fa-times"></i>
              </button>
            </div>
          `;
        });
        diaryList.innerHTML = html;

        document.querySelectorAll('.diary-item-img').forEach(img => {
          img.addEventListener('click', function() {
            const corteId = parseInt(this.dataset.corteid);
            const imageIndex = parseInt(this.dataset.imageindex);
            const corte = cortes.find(c => c.id === corteId);
            if (corte) {
              closeDiary();
              openModal(corte);
              setTimeout(() => {
                currentImageIndex = imageIndex;
                updateModalImage();
              }, 100);
            }
          });
        });

        document.querySelectorAll('.diary-item-remove').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const index = parseInt(this.dataset.index);
            favorites.splice(index, 1);
            saveFavorites();
            renderDiary();
            renderCards();
            renderGallery();
            if (currentModalData) {
              updateModalFavButton();
            }
          });
        });
      }

      function setupModalScroll() {
        modalCarousel.addEventListener('touchstart', function(e) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          isSwiping = false;
        }, { passive: true });

        modalCarousel.addEventListener('touchmove', function(e) {
          if (!currentModalData) return;
          const touchX = e.touches[0].clientX;
          const touchY = e.touches[0].clientY;
          const diffX = touchStartX - touchX;
          const diffY = touchStartY - touchY;

          if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
            isSwiping = true;
            e.preventDefault();
          }
        }, { passive: false });

        modalCarousel.addEventListener('touchend', function(e) {
          if (!currentModalData || !isSwiping) return;
          const touchX = e.changedTouches[0].clientX;
          const diffX = touchStartX - touchX;

          if (Math.abs(diffX) > 50) {
            if (diffX > 0) {
              navigateModal(1);
            } else {
              navigateModal(-1);
            }
          }
          isSwiping = false;
        }, { passive: true });

        modalCarousel.addEventListener('wheel', function(e) {
          if (!currentModalData) return;
          e.preventDefault();
          if (e.deltaY > 20) {
            navigateModal(1);
          } else if (e.deltaY < -20) {
            navigateModal(-1);
          }
        }, { passive: false });
      }

      // CONTATO
      function openContato() {
        contatoModal.classList.add('open');
        document.body.style.overflow = 'hidden';
        updateFooterActive('contato');
      }

      function closeContato() {
        contatoModal.classList.remove('open');
        document.body.style.overflow = '';
      }

      function openGallery() {
        renderGallery();
        galleryModal.classList.add('open');
        document.body.style.overflow = 'hidden';
        updateFooterActive('galeria');
      }

      function closeGallery() {
        galleryModal.classList.remove('open');
        document.body.style.overflow = '';
      }

      function openDiary() {
        renderDiary();
        diaryModal.classList.add('open');
        document.body.style.overflow = 'hidden';
        updateFooterActive('favoritos');
      }

      function closeDiary() {
        diaryModal.classList.remove('open');
        document.body.style.overflow = '';
      }

      function updateFooterActive(section) {
        document.querySelectorAll('.footer-item').forEach(item => {
          item.classList.toggle('active', item.dataset.section === section);
        });
      }

      // FILTROS
      filterGroup.addEventListener('click', function(e) {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderCards();
        renderGallery();
        updateFooterActive('inicio');
      });

      // BUSCA
      searchInput.addEventListener('input', function() {
        searchTerm = this.value.trim();
        renderCards();
        renderGallery();
        updateFooterActive('inicio');
      });

      // MODAL
      modalClose.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) closeModal();
      });

      modalImgFav.addEventListener('click', function(e) {
        e.stopPropagation();
        if (currentModalData) {
          const imgUrl = currentModalData.imagens[currentImageIndex] || currentModalData.imagens[0];
          toggleImageFavorite(
            currentModalData.id,
            currentImageIndex,
            imgUrl,
            currentModalData.nome
          );
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closeModal();
          closeGallery();
          closeDiary();
          closeContato();
        }
        if (e.key === 'ArrowLeft' && modalOverlay.classList.contains('open')) {
          e.preventDefault();
          navigateModal(-1);
        }
        if (e.key === 'ArrowRight' && modalOverlay.classList.contains('open')) {
          e.preventDefault();
          navigateModal(1);
        }
      });

      modalPrev.addEventListener('click', function(e) {
        e.stopPropagation();
        navigateModal(-1);
      });

      modalNext.addEventListener('click', function(e) {
        e.stopPropagation();
        navigateModal(1);
      });

      // FOOTER NAVEGAÇÃO
      btnInicio.addEventListener('click', function() {
        updateFooterActive('inicio');
      });

      btnGaleria.addEventListener('click', function() {
        openGallery();
      });

      btnFavoritos.addEventListener('click', function() {
        openDiary();
      });

      btnContato.addEventListener('click', function() {
        openContato();
      });

      // GALERIA
      galleryClose.addEventListener('click', closeGallery);
      galleryModal.addEventListener('click', function(e) {
        if (e.target === galleryModal) closeGallery();
      });

      // DIÁRIO
      diaryClose.addEventListener('click', closeDiary);
      diaryModal.addEventListener('click', function(e) {
        if (e.target === diaryModal) closeDiary();
      });

      // CONTATO
      contatoClose.addEventListener('click', closeContato);
      contatoModal.addEventListener('click', function(e) {
        if (e.target === contatoModal) closeContato();
      });

      // COPIAR PIX
      document.getElementById('copyPixBtn').addEventListener('click', function() {
        const pixKey = 'hairbymarciostylist@gmail.com';
        if (navigator.clipboard) {
          navigator.clipboard.writeText(pixKey).then(() => {
            const originalText = this.textContent;
            this.textContent = '✅ Copiado!';
            this.style.background = '#2ecc71';
            setTimeout(() => {
              this.textContent = originalText;
              this.style.background = '';
            }, 2500);
          }).catch(() => fallbackCopy(this, pixKey));
        } else {
          fallbackCopy(this, pixKey);
        }
      });

      function fallbackCopy(btn, text) {
        const input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        const originalText = btn.textContent;
        btn.textContent = '✅ Copiado!';
        btn.style.background = '#2ecc71';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.background = '';
        }, 2500);
      }

      // FORMULÁRIO DE CONTATO
      document.getElementById('contatoForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const inputs = this.querySelectorAll('input, textarea');
        let valid = true;
        inputs.forEach(input => {
          if (!input.value.trim()) {
            input.classList.add('error');
            valid = false;
          } else {
            input.classList.remove('error');
          }
        });
        if (!valid) {
          alert('⚠️ Preencha todos os campos.');
          return;
        }
        alert('📨 Mensagem enviada com sucesso!');
        this.reset();
      });

      // AJUSTE DE REDIMENSIONAMENTO
      let resizeTimeout;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(adjustCarouselPadding, 100);
      });

      // INICIALIZAÇÃO
      setupModalScroll();
      updateFavCount();
      renderCards();
      
      setTimeout(adjustCarouselPadding, 100);
    })();
  </script>
